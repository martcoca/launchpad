name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          mask-aws-account-id: true
      - name: Upload immutable assets
        env:
          SITE_BUCKET: ${{ secrets.SITE_BUCKET }}
        run: >-
          aws s3 sync out/ "s3://${SITE_BUCKET}" --delete --only-show-errors
          --exclude "*" --include "_next/static/*"
          --cache-control "public, max-age=31536000, immutable"
      - name: Upload HTML and other mutable files
        env:
          SITE_BUCKET: ${{ secrets.SITE_BUCKET }}
        run: >-
          aws s3 sync out/ "s3://${SITE_BUCKET}" --delete --only-show-errors
          --exclude "_next/static/*"
          --cache-control "no-cache, no-store, must-revalidate"
      - name: Invalidate changed HTML entry points
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: >-
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID"
          --paths "/" "/index.html" "/404.html" --no-cli-pager --output text >/dev/null
